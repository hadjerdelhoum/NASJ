# One-click backend + database on Render (https://render.com): New > Blueprint > pick this repo.
services:
  - type: web
    name: nasj-api
    runtime: node
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run migrate:prod && npm run seed:prod && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: nasj-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://localhost,http://localhost
databases:
  - name: nasj-db
    plan: free
