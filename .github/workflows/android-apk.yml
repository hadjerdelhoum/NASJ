name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Locate the frontend folder (works wherever the project sits in the repo)
        run: |
          CFG=$(find . -name capacitor.config.ts -not -path "*/node_modules/*" | head -1)
          if [ -z "$CFG" ]; then echo "capacitor.config.ts not found in the repo"; ls -R | head -50; exit 1; fi
          echo "FE=$(cd "$(dirname "$CFG")" && pwd)" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: cd "$FE" && npm install
      - name: Build web app (points at your hosted API)
        env:
          # Repo > Settings > Secrets and variables > Actions > Variables > API_URL
          VITE_API_URL: ${{ vars.API_URL }}
        run: cd "$FE" && npm run build
      - name: Add Android project and sync
        run: cd "$FE" && npx cap add android && npx cap sync android
      - name: Build debug APK
        run: cd "$FE/android" && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: nasj-debug-apk
          path: ${{ env.FE }}/android/app/build/outputs/apk/debug/app-debug.apk
